; Dedicated pytest configuration for the SWE-Forge test suite.
;
; Why a separate root: the upstream Open SWE `tests/conftest.py` imports the
; full server stack (fastapi, deepagents, provider SDKs). SWE-Forge's tests must
; run without installing that stack and without any API key, so they live in a
; sibling directory that pytest never walks `tests/conftest.py` for.
;
; Usage:  python -m pytest -c pytest-sweforge.ini
;
; The upstream suite is untouched and still runs via `python -m pytest`.
[pytest]
testpaths = tests_sweforge
addopts = -q --no-header
filterwarnings =
    ignore::DeprecationWarning
